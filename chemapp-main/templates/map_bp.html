{% extends "base.html" %}

{% block iframe %}
<div class="tour_box">
  <div class="list_box" id="list">
    <ul class="list-group">
      {% for show in shows|sort(attribute='2', reverse=True) %}
        <li class="list-group-item show-item" data-lat="{{ show[3] }}" data-lng="{{ show[4] }}" data-date="{{ show[2] }}" onclick="activateListItem(this)">
          <div class="show-info">
            <div class="show-details">
                <p class="date-display"></p>
                <h4>{{ show[1] }}</h4>
                <!-- Add the button with the link here
              <a href="{{ show[5] }}" class="btn btn-primary" target="_blank">Buy Tickets</a> -->
             
            </div>
          </div>
        </li>
      {% endfor %}
    </ul>
  </div>

  
  <div id="map" class="map_box" ></div>


   <script>
         var map = L.map('map').setView([52.022727853219074, 6.421852949418699], 6);
    
    // Define base layers
var baseLayers = {
  "CartoDB_DarkMatter": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
  }),
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  })

};

var markers = L.markerClusterGroup({ // Create marker cluster group
    iconCreateFunction: function(cluster) {
        var childCount = cluster.getChildCount();
        var c = ' marker-cluster-';
        if (childCount < 10) {
            c += 'small';
        } else if (childCount < 100) {
            c += 'medium';
        } else {
            c += 'large';
        }

        return new L.DivIcon({
            html: '<div><span>' + childCount + '</span></div>',
            className: 'marker-cluster' + c,
            iconSize: new L.Point(40, 40),
            fillColor: 'yellow',
            color: '#f00800',
            weight: 5,
            opacity: 1,
            fillOpacity: 0.8,
        });
    }
});

// Retrieve the shows data passed from Flask
var shows = {{ shows | tojson }};

var activeListItem = null; // Track the currently active list item

// Function to activate list item
function activateListItem(item) {
    // Deactivate previously active item
    if (activeListItem !== null) {
        activeListItem.classList.remove('active');
    }
    
    // Activate the clicked item
    item.classList.add('active');
    activeListItem = item;
    
    // Zoom to the selected item's location
    var lat = parseFloat(item.getAttribute('data-lat'));
    var lng = parseFloat(item.getAttribute('data-lng'));
    map.setView([lat, lng], 17);
}

// Loop through the shows data and add markers to the map
for (var i = 0; i < shows.length; i++) {
    var show = shows[i];
    var popupContent = "<b>" + show[1] + "</b><br>" + show[2] + "</b><br>" + show[5] + "</b><br>" + show[6]; 
    var marker = L.marker([show[3], show[4]]).bindPopup(popupContent);
    markers.addLayer(marker);
}

var overlays = {
    "Markers": markers
};

L.control.layers(baseLayers, overlays).addTo(map);

baseLayers.CartoDB_DarkMatter.addTo(map);
markers.addTo(map);

// Switch basemap when zoomed in to level 20
map.on('zoomend', function() {
    var zoomLevel = map.getZoom();
    if (zoomLevel > 15) {
        // Switch basemap to OpenStreetMap
        map.removeLayer(baseLayers.CartoDB_DarkMatter);
        baseLayers.OpenStreetMap.addTo(map);
    }
});
    </script>

  
{% endblock iframe %}
