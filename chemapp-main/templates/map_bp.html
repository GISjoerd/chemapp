{% extends "base.html" %}
{% block iframe %}
<div id="music" class="bg-1">
    <div class="container-fluid">
        <h1 class="text-left">Tour dates</h1>
        <div style="display: flex; width: 100%; margin-right: 10px;">
            <div style="flex: 1;">
                <p class="text-center">Lorem ipsum we'll play you some music.<br> Remember to book your tickets!</p>
                <ul class="list-group">
                    <li class="list-group-item">September Sold Out!</li>
                    <li class="list-group-item">October Sold Out!</li>
                    <li class="list-group-item">November 3</li>
                </ul>
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end; margin-right: 5px;">
                {{ iframe|safe }}
            </div>
        </div>
    </div>
</div>
{% endblock iframe %}
