{% extends "base.html" %}

{% block iframe %}
<div class="bg-1" style="display: flex;">
  <div class="bg-1" id="list" style="flex: 1; height: 100vh; overflow-y: auto;">
    <ul class="list-group">
      {% for show in shows|sort(attribute='2', reverse=True) %}
        <li class="list-group-item show-item" data-lat="{{ show[3] }}" data-lng="{{ show[4] }}">
          <div class="show-info">
            <!--!img src="{{ url_for('static', filename='cc_resize.jpg') }}" alt="band" class="show-image"-->
            <div class="show-details">
              <h4>{{ show[1] }}</h4>
              <p>Date: {{ show[2] }}</p>
            </div>
          </div>
        </li>
      {% endfor %}
    </ul>
  </div>

  
  <div id="map" class="bg-1" style="flex: 1; height: 100vh;"></div>


   <script>
        var map = L.map('map').setView([52.022727853219074, 6.421852949418699], 6);
    
            // Define base layers
        var baseLayers = {
          "CartoDB_DarkMatter": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
	            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	            subdomains: 'abcd',
	            maxZoom: 20
          }),
              "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          })
        
        };

        var markers = L.markerClusterGroup({ // Create marker cluster group
            iconCreateFunction: function(cluster) {
                var childCount = cluster.getChildCount();
                var c = ' marker-cluster-';
                if (childCount < 10) {
                    c += 'small';
                } else if (childCount < 100) {
                    c += 'medium';
                } else {
                    c += 'large';
                }

                return new L.DivIcon({
                    html: '<div><span>' + childCount + '</span></div>',
                    className: 'marker-cluster' + c,
                    iconSize: new L.Point(40, 40),
                    fillColor: '#ffffff',
                    color: '#f00800',
                    weight: 5,
                    opacity: 1,
                    fillOpacity: 0.8,
                });
            }
        });

        // Retrieve the shows data passed from Flask
        var shows = {{ shows | tojson }};
    
        // Loop through the shows data and add markers to the map
        for (var i = 0; i < shows.length; i++) {
            var show = shows[i];
            var popupContent = "<b>" + show[1] + "</b><br>" + show[2]; // Adjust this according to your data structure
            var marker = L.marker([show[3], show[4]]).bindPopup(popupContent);
            markers.addLayer(marker);
        }

        var overlays = {
            "Markers": markers
        };

        L.control.layers(baseLayers, overlays).addTo(map);
        
        baseLayers.CartoDB_DarkMatter.addTo(map);


        // Attach onclick event handler to list items
        var listItems = document.querySelectorAll('.show-item');
        listItems.forEach(function(item) {
            item.addEventListener('click', function() {
                var lat = parseFloat(this.getAttribute('data-lat'));
                var lng = parseFloat(this.getAttribute('data-lng'));
                map.setView([lat, lng], 20);
            });

        });

        // Switch basemap when zoomed in to level 20
        map.on('zoomend', function() {
            var zoomLevel = map.getZoom();
            if (zoomLevel === 20) {
                // Switch basemap to OpenStreetMap
                map.removeLayer(baseLayers.CartoDB_DarkMatter);
                baseLayers.OpenStreetMap.addTo(map);
            }
        });
    </script>

    

{% endblock iframe %}
